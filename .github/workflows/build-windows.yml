name: build-windows-installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Freeze agent service
        run: pyinstaller --name screentime-ad-agent --onedir --noconsole agent_windows/agent_service.py

      - name: Freeze tray
        run: pyinstaller --name screentime-ad-tray --onedir --noconsole --windowed agent_windows/tray.py

      - name: Download NSSM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://nssm.cc/release/nssm-2.24.zip" -OutFile nssm.zip
          Expand-Archive -Path nssm.zip -DestinationPath nssm-extracted
          Copy-Item "nssm-extracted/nssm-2.24/win64/nssm.exe" "installer/nssm.exe"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "installer\screentime-ad.iss" "/DMyAppVersion=${{ steps.version.outputs.version }}"

      - name: Checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer\Output\*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii installer\Output\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: screentime-ad-agent-setup
          path: installer/Output/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*
