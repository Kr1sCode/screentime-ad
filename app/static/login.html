<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>screentime-ad // login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #05080d; --grid: rgba(34, 211, 238, 0.05); --panel: rgba(12, 20, 28, 0.85);
    --panel-border: rgba(34, 211, 238, 0.2); --accent: #22d3ee; --crit: #ff4d5e; --text: #dff6fb;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, sans-serif; color: var(--text);
    background:
      radial-gradient(ellipse 900px 500px at 20% 0%, rgba(34,211,238,0.12), transparent 60%),
      var(--bg);
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 42px 42px; pointer-events: none;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, black, transparent 75%);
  }
  form {
    position: relative; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 4px;
    padding: 2.2rem 2rem; width: 300px; backdrop-filter: blur(6px);
  }
  .c { position: absolute; width: 14px; height: 14px; }
  .tl { top: -1px; left: -1px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
  .tr { top: -1px; right: -1px; border-top: 2px solid var(--accent); border-right: 2px solid var(--accent); }
  .bl { bottom: -1px; left: -1px; border-bottom: 2px solid var(--accent); border-left: 2px solid var(--accent); }
  .br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }
  h1 { font-size: .85rem; margin: 0 0 1.4rem; letter-spacing: .3em; text-transform: uppercase; color: var(--accent); text-shadow: 0 0 12px rgba(34,211,238,.6); text-align: center; }
  input { width: 100%; box-sizing: border-box; padding: .65rem .7rem; margin-bottom: .8rem; border-radius: 3px; border: 1px solid var(--panel-border); background: #0a1219; color: var(--text); font-family: var(--mono); font-size: .85rem; }
  button { width: 100%; padding: .65rem; border: 1px solid var(--accent); border-radius: 3px; background: rgba(34,211,238,.1); color: var(--accent); font-weight: 600; cursor: pointer; font-family: var(--mono); text-transform: uppercase; letter-spacing: .1em; font-size: .8rem; }
  button:hover { background: rgba(34,211,238,.2); box-shadow: 0 0 14px rgba(34,211,238,.3); }
  #err { color: var(--crit); font-family: var(--mono); font-size: .75rem; min-height: 1.2rem; margin-top: .6rem; text-align: center; }
</style>
</head>
<body>
<form id="f">
  <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
  <h1>screentime-ad</h1>
  <input name="username" placeholder="login" autocomplete="username" value="admin">
  <input name="password" type="password" placeholder="hasło" autocomplete="current-password">
  <button type="submit">Zaloguj</button>
  <div id="err"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: f.get('username'), password: f.get('password') }),
  });
  if (res.ok) { location.href = '/'; return; }
  const data = await res.json().catch(() => ({}));
  document.getElementById('err').textContent = data.error || 'błąd logowania';
});
</script>
</body>
</html>
